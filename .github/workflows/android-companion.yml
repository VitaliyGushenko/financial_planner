name: Android companion

on:
  push:
    branches: [main]
    paths:
      - 'android-companion/**'
      - '.github/workflows/android-companion.yml'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.7'

      - name: Build debug APK
        working-directory: android-companion
        run: |
          set -o pipefail
          gradle assembleDebug --no-daemon --stacktrace 2>&1 | tee build.log

      - name: Show build errors
        if: failure()
        working-directory: android-companion
        run: |
          block=$(awk '/FAILURE: Build failed with an exception/{flag=1} flag' build.log | head -n 40)
          if [ -z "$block" ]; then
            block=$(tail -n 40 build.log)
          fi
          block="${block//'%'/'%25'}"
          block="${block//$'\r'/''}"
          block="${block//$'\n'/'%0A'}"
          echo "::error::$block"

      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: android-build-log
          path: android-companion/build.log
          if-no-files-found: ignore

      - uses: actions/upload-artifact@v4
        if: success()
        with:
          name: financial-planner-companion-debug
          path: android-companion/app/build/outputs/apk/debug/*.apk
          if-no-files-found: error

      - name: Read version
        id: version
        working-directory: android-companion
        run: |
          version=$(sed -n 's/.*versionName = "\(.*\)"/\1/p' app/build.gradle.kts | head -n1)
          echo "value=$version" >> "$GITHUB_OUTPUT"
          echo "tag=companion-v$version" >> "$GITHUB_OUTPUT"

      # Релиз нужен, чтобы приложение могло само найти и скачать обновление.
      # Новая версия публикуется только при смене versionName — поднимите её в build.gradle.kts.
      - name: Publish release
        if: github.ref == 'refs/heads/main'
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          TAG: ${{ steps.version.outputs.tag }}
          VERSION: ${{ steps.version.outputs.value }}
        working-directory: android-companion
        run: |
          if gh release view "$TAG" > /dev/null 2>&1; then
            echo "Релиз $TAG уже существует — публикация не нужна."
            exit 0
          fi
          cp app/build/outputs/apk/debug/app-debug.apk "financial-planner-companion-$VERSION.apk"
          gh release create "$TAG" "financial-planner-companion-$VERSION.apk" \
            --title "Android companion v$VERSION" \
            --notes "Сборка из коммита $GITHUB_SHA. Ставится поверх предыдущей версии, данные и вход сохраняются."
