name: Android companion

on:
  push:
    branches: [main]
    paths:
      - 'android-companion/**'
      - '.github/workflows/android-companion.yml'
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.7'

      - name: Build debug APK
        working-directory: android-companion
        run: |
          set -o pipefail
          gradle assembleDebug --no-daemon --stacktrace 2>&1 | tee build.log

      - name: Show build errors
        if: failure()
        working-directory: android-companion
        run: |
          block=$(awk '/FAILURE: Build failed with an exception/{flag=1} flag' build.log | head -n 40)
          if [ -z "$block" ]; then
            block=$(tail -n 40 build.log)
          fi
          block="${block//'%'/'%25'}"
          block="${block//$'\r'/''}"
          block="${block//$'\n'/'%0A'}"
          echo "::error::$block"

      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: android-build-log
          path: android-companion/build.log
          if-no-files-found: ignore

      - uses: actions/upload-artifact@v4
        if: success()
        with:
          name: financial-planner-companion-debug
          path: android-companion/app/build/outputs/apk/debug/*.apk
          if-no-files-found: error
