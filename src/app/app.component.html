@if (!isReady()) {
  <div class="center-screen"><span class="spinner"></span></div>
} @else if (!isAuthenticated()) {
  <router-outlet />
} @else {
  <header class="app-header">
    <div class="app-header-inner">
      <span class="app-logo">📊 Планировщик</span>
      <nav class="app-nav">
        <a routerLink="/" routerLinkActive="active" [routerLinkActiveOptions]="{ exact: true }">Дашборд</a>
        <a routerLink="/operations" routerLinkActive="active">Операции</a>
        <a routerLink="/calendar" routerLinkActive="active">Календарь</a>
        <a routerLink="/planner" routerLinkActive="active">Покупки</a>
      </nav>
      <div class="app-user">
        <span class="app-username total-chip" title="Всего на счетах">{{ total() }}</span>
        <div class="user-menu">
          <button type="button" class="user-btn" (click)="toggleMenu(); $event.stopPropagation()" [attr.aria-expanded]="menuOpen()">
            <span class="name">{{ displayName() }}</span>
            <span class="caret">▾</span>
          </button>
          @if (menuOpen()) {
            <div class="user-dropdown" (click)="$event.stopPropagation()">
              <a routerLink="/settings" (click)="closeMenu()">Настройки</a>
              <div class="sep"></div>
              <button type="button" class="logout" (click)="logout()">Выйти</button>
            </div>
          }
        </div>
      </div>
    </div>
  </header>
  <main class="app-main">
    <router-outlet />
  </main>
}
