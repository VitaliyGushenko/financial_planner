<app-update-banner />

@if (!isReady()) {
  <div class="app-boot" aria-busy="true" aria-label="Загрузка">
    <div class="skeleton boot-line"></div>
    <div class="skeleton boot-hero"></div>
    <div class="skeleton boot-row"></div>
    <div class="skeleton boot-row"></div>
    <div class="skeleton boot-row"></div>
  </div>
} @else if (!isAuthenticated()) {
  <main>
    <router-outlet />
  </main>
} @else {
  <header class="app-header">
    <div class="app-header-inner">
      <span class="app-logo">
        <img class="app-logo-mark" src="favicon.svg" alt="" width="22" height="22" />
        Планировщик
      </span>
      <nav class="app-nav">
        <a routerLink="/" routerLinkActive="active" [routerLinkActiveOptions]="{ exact: true }">Дашборд</a>
        <a routerLink="/operations" routerLinkActive="active">Операции</a>
        <a routerLink="/calendar" routerLinkActive="active">Календарь</a>
        <a routerLink="/stats" routerLinkActive="active">Статистика</a>
        <a routerLink="/planner" routerLinkActive="active">Покупки</a>
      </nav>
      <div class="app-user">
        <span
          class="app-username total-chip"
          [title]="'Всего на счетах: ' + total()"
          [appCountUp]="totalValue()"
          [appCountUpFormat]="moneyFormat"
        >{{ total() }}</span>
        <div class="user-menu">
          <button type="button" class="user-btn" (click)="toggleMenu(); $event.stopPropagation()" [attr.aria-expanded]="menuOpen()">
            <span class="name">{{ displayName() }}</span>
            <span class="caret">▾</span>
          </button>
          @if (menuOpen()) {
            <div class="user-dropdown" (click)="$event.stopPropagation()">
              <a routerLink="/settings" (click)="closeMenu()">Настройки</a>
              <div class="sep"></div>
              <button type="button" class="logout" (click)="logout()">Выйти</button>
            </div>
          }
        </div>
      </div>
    </div>
  </header>
  <main class="app-main">
    <router-outlet />
  </main>

  <!-- Нижняя навигация: на телефоне заменяет верхнее меню (см. styles.less). -->
  <nav class="app-tabbar" aria-label="Разделы приложения">
    <!-- Пилюля активного раздела: позиция = индекс × ширина таба. -->
    <span
      class="tab-pill"
      aria-hidden="true"
      [style.transform]="'translateX(' + tabIndex() * 100 + '%)'"
      [style.opacity]="tabIndex() < 0 ? 0 : 1"
    ></span>
    <a routerLink="/" routerLinkActive="active" [routerLinkActiveOptions]="{ exact: true }">
      <span class="tab-icon" aria-hidden="true">🏠</span>
      <span class="tab-label">Дашборд</span>
    </a>
    <a routerLink="/operations" routerLinkActive="active">
      <span class="tab-icon" aria-hidden="true">💸</span>
      <span class="tab-label">Операции</span>
    </a>
    <a routerLink="/calendar" routerLinkActive="active">
      <span class="tab-icon" aria-hidden="true">📅</span>
      <span class="tab-label">Календарь</span>
    </a>
    <a routerLink="/stats" routerLinkActive="active">
      <span class="tab-icon" aria-hidden="true">📈</span>
      <span class="tab-label">Статистика</span>
    </a>
    <a routerLink="/planner" routerLinkActive="active">
      <span class="tab-icon" aria-hidden="true">🎯</span>
      <span class="tab-label">Покупки</span>
    </a>
  </nav>
}
