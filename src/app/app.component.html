@if (!isReady()) {
  <div class="center-screen"><span class="spinner"></span></div>
} @else if (!isAuthenticated()) {
  <router-outlet />
} @else {
  <header class="app-header">
    <div class="app-header-inner">
      <span class="app-logo">📊 Планировщик</span>
      <nav class="app-nav">
        <a routerLink="/" routerLinkActive="active" [routerLinkActiveOptions]="{ exact: true }">Дашборд</a>
        <a routerLink="/operations" routerLinkActive="active">Операции</a>
        <a routerLink="/calendar" routerLinkActive="active">Календарь</a>
        <a routerLink="/planner" routerLinkActive="active">Покупки</a>
        <a routerLink="/settings" routerLinkActive="active">Настройки</a>
      </nav>
      <div class="app-user">
        <span class="app-username" title="Всего на счетах">{{ total() }}</span>
        <span class="app-username" [title]="displayName()">{{ displayName() }}</span>
        <button class="btn btn-ghost btn-sm" (click)="logout()">Выйти</button>
      </div>
    </div>
  </header>
  <main class="app-main">
    <router-outlet />
  </main>
}
